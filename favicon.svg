<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="scalension-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Squircle Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0B0F19" stroke="#1E293B" stroke-width="3"/>

  <!-- Glowing Icon Emblem -->
  <g filter="url(#glow)">
    <!-- Stylized S Curve -->
    <path d="M 38 90 C 26 90 24 76 38 68 C 52 60 76 66 76 48 C 76 34 60 30 46 34" 
          fill="none" 
          stroke="url(#scalension-grad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Ascending Arrow Head -->
    <path d="M 68 28 L 94 28 L 94 54 M 94 28 L 62 60" 
          fill="none" 
          stroke="url(#scalension-grad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
